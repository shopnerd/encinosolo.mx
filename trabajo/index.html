<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Encino Solo Work List</title>
<meta name="theme-color" content="#2e5c45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --ground:#eceee5; --surface:#f8f9f3; --raised:#ffffff; --ink:#1d251f; --muted:#5a655c; --line:#d6dace; --line2:#b9bfb0;
  --accent:#2e5c45; --accent-ink:#ffffff; --accent-soft:#dde8df;
  --sun:#b87c0c; --sun-soft:#f6ead0; --late:#ad3726; --late-soft:#f5dfd9; --ok:#3b7a4b;
  --fence:#7b5a3a; --water:#2b6c92; --elec:#8c6a00; --plumb:#58609c; --propane:#a24f7a; --gas:#b4501c; --diesel:#4f5a2a;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121612; --surface:#1a1f1b; --raised:#222822; --ink:#e5e9de; --muted:#9ba596; --line:#2d342d; --line2:#46503f;
  --accent:#86bd9a; --accent-ink:#0f1a13; --accent-soft:#233429;
  --sun:#e3ab43; --sun-soft:#3a2f18; --late:#ea7560; --late-soft:#3d221c; --ok:#7fbf8d;
  --fence:#c49d77; --water:#71b3da; --elec:#d8b94c; --plumb:#a3a8e4; --propane:#de8fb7; --gas:#f08a55; --diesel:#b9c77a;
}}
:root[data-theme="dark"]{
  --ground:#121612; --surface:#1a1f1b; --raised:#222822; --ink:#e5e9de; --muted:#9ba596; --line:#2d342d; --line2:#46503f;
  --accent:#86bd9a; --accent-ink:#0f1a13; --accent-soft:#233429;
  --sun:#e3ab43; --sun-soft:#3a2f18; --late:#ea7560; --late-soft:#3d221c; --ok:#7fbf8d;
  --fence:#c49d77; --water:#71b3da; --elec:#d8b94c; --plumb:#a3a8e4; --propane:#de8fb7; --gas:#f08a55; --diesel:#b9c77a;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.45 var(--body);margin:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--ground);border-bottom:1px solid var(--line)}
.top .wrap{padding-bottom:0}
.bar1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.brand small{display:block;font:700 11px/1 var(--display);font-stretch:125%;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:4px 0 0;font:800 26px/1 var(--display);font-stretch:88%;letter-spacing:-.01em}
.sync{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 12px 6px 10px;font-size:13px;white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.sync.off i{background:var(--sun)}
.sync.off{background:var(--sun-soft);border-color:var(--sun)}
.viewer{display:flex;align-items:center;gap:8px;margin:12px 0 10px;overflow-x:auto;scrollbar-width:none}
.viewer span{font-size:13px;color:var(--muted);white-space:nowrap}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs button{border:0;background:none;padding:10px 10px 12px;font:700 13px/1 var(--display);font-stretch:112%;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.mock{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:12px 0 0}
.mock button{background:none;border:0;text-decoration:underline;color:var(--muted);padding:0;font-size:13px}

/* sections + lists */
h2.sec{display:flex;align-items:baseline;gap:8px;margin:26px 0 8px;font:700 12px/1 var(--display);font-stretch:118%;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2.sec b{font-variant-numeric:tabular-nums;color:var(--ink)}
h2.sec.late{color:var(--late)}
h2.sec.today{color:var(--sun)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:52px 1fr auto;align-items:center;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{align-self:stretch;border:0;background:none;display:grid;place-items:center}
.check span{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px;opacity:0}
.item.is-done .check span{background:var(--accent);border-color:var(--accent)}
.item.is-done .check svg{opacity:1;color:var(--accent-ink)}
.item.is-done .title{text-decoration:line-through;color:var(--muted)}
.open{border:0;background:none;text-align:left;padding:12px 12px 12px 0;min-width:0}
.title{display:block;font-weight:700;text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-size:13.5px;color:var(--muted)}
.meta .due{font-variant-numeric:tabular-nums}
.meta .due.late{color:var(--late);font-weight:700}
.meta .due.today{color:var(--sun);font-weight:700}
.sys{display:inline-flex;align-items:center;gap:5px}
.sys::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.rep{white-space:nowrap}
.tag{font-style:italic;font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;margin-right:10px}
.empty{padding:18px;color:var(--muted);background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r)}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.wa{display:inline-flex;align-items:center;gap:8px;background:#1f7a4d;color:#fff;text-decoration:none;border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px}
.wa[aria-disabled="true"]{background:var(--line);color:var(--muted);pointer-events:none}
.wa svg{width:18px;height:18px}
.hint{font-size:13px;color:var(--muted)}

/* places + systems */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:18px;font-size:14px}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline}
.pl{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:13px 14px}
.list > li:first-child .pl{border-top:0}
.pl strong{display:block}
.pl small{color:var(--muted);font-size:13px}
.count{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:2ch;text-align:right}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--late-soft);color:var(--late);white-space:nowrap}
.pl .arrow{color:var(--muted)}
.subplaces{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.grp{margin:18px 0 6px;font-weight:700;font-size:15px}
.systems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.systile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:6px}
.systile[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.systile strong{font:800 20px/1.05 var(--display);font-stretch:92%;display:flex;align-items:center;gap:8px}
.systile strong::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.systile small{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}

/* goals */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;overflow:hidden}
.goal header{padding:14px 14px 12px;display:grid;gap:8px}
.goal h3{margin:0;font:800 21px/1.1 var(--display);font-stretch:92%;text-wrap:balance}
.goal .gm{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.goal .list{border:0;border-top:1px solid var(--line);border-radius:0}
.goal footer{border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:14px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;font-size:14px}

/* routines */
.steps{margin:4px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}

/* people */
.person{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.list > .person:first-child{border-top:0}
.person strong{display:block}
.role{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.role.volunteer,.role.cleaning{background:var(--sun-soft);color:var(--sun)}
.person .acts{display:flex;gap:6px}
.btn{border:1px solid var(--line2);background:var(--raised);border-radius:8px;padding:7px 12px;font-size:14px}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.addperson{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-top:12px}
.addperson input,.addperson select{border:1px solid var(--line2);background:var(--raised);border-radius:8px;padding:8px 10px;min-width:0}

/* animals */
.animal{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.list > .animal:first-child{border-top:0}
.animal input,.animal select,.addanimal input,.addanimal select{border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.animal input{font-weight:700;font-size:16px}
.animal input:hover,.animal select:hover,.animal input:focus,.animal select:focus{border-color:var(--line2);background:var(--raised)}
.animal .n{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.addanimal{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}
.addanimal input,.addanimal select{border-color:var(--line2);background:var(--raised)}
@media (max-width:560px){.animal{grid-template-columns:1fr 1fr}}

/* fab */
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:20px;z-index:6;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:800 16px/1 var(--display);font-stretch:108%;letter-spacing:.02em;padding:16px 22px;box-shadow:0 6px 18px rgba(20,30,20,.25)}

/* editor */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,15,10,.45)}
.ed{display:grid;gap:14px;padding:18px}
.ed h3{margin:0;font:800 22px/1 var(--display);font-stretch:92%}
.ed label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:700}
.ed input[type=text],.ed input[type=date],.ed select,.ed textarea{border:1px solid var(--line2);background:var(--raised);border-radius:8px;padding:9px 10px;font-weight:400;color:var(--ink);font-size:16px;width:100%}
.ed textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--raised);padding:9px 6px;font-size:14px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:700}
.whos{display:flex;flex-wrap:wrap;gap:6px}
.photo img{width:100%;max-height:220px;object-fit:cover;border-radius:8px}
.edfoot{display:flex;justify-content:space-between;gap:8px;position:sticky;bottom:0;background:var(--surface);padding:12px 18px;border-top:1px solid var(--line)}
.readsteps{margin:0;padding-left:22px;display:grid;gap:4px}

/* toast */
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--ground);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:15px;max-width:calc(100vw - 24px)}
.toast button{border:0;background:none;color:var(--ground);font-weight:700;text-decoration:underline;padding:0}

/* simple (crew) mode */
body.simple .title{font-size:19px}
body.simple .check{}
body.simple .check span{width:36px;height:36px}
body.simple .item{grid-template-columns:62px 1fr auto}
body.simple .open{padding:16px 12px 16px 0}
@media (min-width:760px){ .brand h1{font-size:32px} .systems{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:520px){ .addperson{grid-template-columns:1fr 1fr} .addperson input{grid-column:1/-1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
.gate{max-width:440px;margin:0 auto;padding:12vh 20px 40px;display:grid;gap:18px}
.gate .brand h1{font-size:30px}
.gate .es{font-weight:500;color:var(--muted)}
.gp{margin:0;color:var(--muted);text-wrap:pretty}
.gstep{display:grid;gap:10px}
.gate input{border:1px solid var(--line2);background:var(--raised);border-radius:10px;padding:12px 14px;font-size:18px;width:100%}
.gerr{margin:0;padding:12px 14px;border-radius:10px;background:var(--late-soft);color:var(--late);font-weight:700;text-wrap:pretty}
.gate .link{justify-self:start}
.btn.big{padding:13px 16px;font-size:16px}
.person{grid-template-columns:minmax(0,1fr) auto;align-items:start}
.person .acts{flex-wrap:wrap;justify-content:flex-end}
.pedit{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pedit select,.pedit input{border:1px solid var(--line2);background:var(--raised);border-radius:6px;padding:5px 8px;font-size:14px;min-width:0}
.pedit input{width:11em}
.addperson{grid-template-columns:repeat(3,minmax(0,1fr))}
.addperson input[name=name]{grid-column:1/-1}
@media (max-width:560px){.person{grid-template-columns:1fr}.person .acts{justify-content:flex-start}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<section class="gate" id="gate" hidden>
  <div class="brand"><small>Encino Solo · Baja</small><h1>Work list <span class="es">· Lista de trabajo</span></h1></div>
  <div id="gateLogin" hidden>
    <p class="gp">Sign in with your email. We'll send you a code.<br><span class="es">Entra con tu correo. Te mandamos un código.</span></p>
    <div class="gstep" id="stepEmail">
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="your@email.com">
      <button class="btn primary big" id="sendCode" type="button">Send me a code · Mandar código</button>
      <button class="link" id="haveCode" type="button">I already have a code · Ya tengo un código</button>
    </div>
    <p class="gerr" id="gateErr" role="alert" hidden></p>
    <div class="gstep" id="stepCode" hidden>
      <p class="gp" id="codeMsg"></p>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="8-digit code · código" maxlength="10">
      <button class="btn primary big" id="verify" type="button">Sign in · Entrar</button>
      <button class="link" id="otherEmail" type="button">Use a different email · Otro correo</button>
    </div>
    <p class="gp es">¿Trabajas en el rancho y no tienes correo? Pídele a Walker tu enlace por WhatsApp.</p>
  </div>
  <div id="gateMsg" hidden><p class="gp" id="gateText"></p><button class="btn" id="gateOut" type="button">Sign out · Salir</button></div>
</section>

<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="bar1">
      <div class="brand"><small>Encino Solo · Baja</small><h1 id="h1">Work list</h1></div>
      <button class="sync" id="sync" type="button"><i></i><span></span></button>
    </div>
    <div class="viewer" id="viewer"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap">
  <div class="mock" id="mock"></div>
  <div id="view"></div>
</main>
<button class="fab" id="fab" type="button">+ Add</button>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

/* ---------- local state ---------- */
let state = {places:[],helpers:[],animals:[],items:[],viewer:null};
let meta = freshMeta();
function freshMeta(){ return {me:null,cursor:{},outbox:{},tombs:{},edited:{},logs:[],photos:{},online:true,pending:0}; }
const shadow = new Map();   // "kind:id" -> JSON of what the server has (or will have)
function rebuildShadow(){
 shadow.clear();
 for(const k in KINDS) for(const r of state[k]){ const key=k+':'+r.id; if(!meta.outbox[key]) shadow.set(key, JSON.stringify(KINDS[k].to(r))); }
 for(const key in meta.tombs){ /* pending deletes stay out of the shadow */ }
}
function loadLocal(){
 try{ const saved=JSON.parse(localStorage.getItem(LKEY)); if(saved&&saved.state){ state=saved.state; meta=Object.assign(freshMeta(),saved.meta||{}); } }catch(e){}
 if(DEMO&&!state.helpers.length){ state=seed(); }
 rebuildShadow();
 // records the shadow skipped because they were mid-send still need a baseline to diff against
 for(const k in KINDS) for(const r of state[k]){ const key=k+':'+r.id; if(!shadow.has(key)) shadow.set(key, JSON.stringify(KINDS[k].to(r))); }
}
function saveLocal(){
 const data={state,meta};
 try{ localStorage.setItem(LKEY, JSON.stringify(data)); }
 catch(e){ try{ localStorage.setItem(LKEY, JSON.stringify({state, meta:Object.assign({},meta,{photos:{}})})); }catch(e2){} }
}

/* commit: diff every record against the shadow, queue what changed */
function commit(){
 const now=new Date().toISOString(), seen=new Set();
 for(const k in KINDS) for(const r of state[k]){
  const key=k+':'+r.id, j=JSON.stringify(KINDS[k].to(r)); seen.add(key);
  if(shadow.get(key)!==j){ shadow.set(key,j); meta.edited[key]=now; meta.outbox[key]=1; delete meta.tombs[key]; if(DEMO&&!meta.online)meta.pending++; }
 }
 for(const [key,j] of [...shadow]){
  if(seen.has(key)) continue;
  shadow.delete(key); const row=JSON.parse(j); row.deleted=true; meta.tombs[key]=row; meta.edited[key]=now; meta.outbox[key]=1; if(DEMO&&!meta.online)meta.pending++;
 }
 if(DEMO){ meta.outbox={}; meta.tombs={}; }
 saveLocal(); renderAll(); schedulePush();
}

/* ---------- server sync ---------- */
let sb=null, syncing=false, again=false, lastErr=null, pushTimer=null, noAccess=false;
const splitKey = key => { const i=key.indexOf(':'); return [key.slice(0,i), key.slice(i+1)]; };
const myName = () => { const h=helper(meta.me); return h?h.name:null; };
const pendingCount = () => Object.keys(meta.outbox).length + meta.logs.length + Object.keys(meta.photos).length;
function schedulePush(){ if(DEMO||!sb)return; clearTimeout(pushTimer); pushTimer=setTimeout(sync, 500); }

async function pushOutbox(){
 const by={};
 for(const key of Object.keys(meta.outbox)){
  const [k,id]=splitKey(key); if(!KINDS[k]){ delete meta.outbox[key]; continue; }
  const rec=state[k].find(r=>r.id===id);
  let row = rec ? KINDS[k].to(rec) : meta.tombs[key];
  if(!row){ delete meta.outbox[key]; continue; }
  row = Object.assign({}, row, {deleted:!rec, edited_at:meta.edited[key]||new Date().toISOString(), updated_by:myName()});
  (by[k]=by[k]||[]).push({key,row});
 }
 for(const k in by){
  const {error}=await sb.from(KINDS[k].table).upsert(by[k].map(x=>x.row), {onConflict:'id'});
  if(error) throw error;
  for(const x of by[k]) if(meta.edited[x.key]===x.row.edited_at){ delete meta.outbox[x.key]; delete meta.tombs[x.key]; }
 }
}
async function pushLogs(){
 if(!meta.logs.length) return;
 const batch=meta.logs.slice();
 const {error}=await sb.from('work_log').upsert(batch, {onConflict:'id'});
 if(error) throw error;
 meta.logs=meta.logs.filter(l=>!batch.includes(l));
}
async function pushPhotos(){
 for(const path of Object.keys(meta.photos)){
  const blob=await (await fetch(meta.photos[path])).blob();
  const {error}=await sb.storage.from('work-photos').upload(path, blob, {upsert:true, contentType:'image/jpeg'});
  if(error) throw error;
  photoUrls[path]=meta.photos[path]; delete meta.photos[path];
 }
}
function mergeRow(k,row){
 const key=k+':'+row.id;
 if(meta.outbox[key]){
  if(ts(meta.edited[key]) > ts(row.edited_at)) return false;   // ours is newer; it will be sent
  delete meta.outbox[key]; delete meta.tombs[key];
 }
 const arr=state[k], i=arr.findIndex(r=>r.id===row.id);
 if(row.deleted){ shadow.delete(key); if(i>=0){ arr.splice(i,1); return true; } return false; }
 const rec=KINDS[k].from(row); if(k==='items') normItem(rec);
 const j=JSON.stringify(KINDS[k].to(rec));
 meta.edited[key]=row.edited_at;
 if(i>=0 && shadow.get(key)===j && JSON.stringify(KINDS[k].to(arr[i]))===j) return false;
 if(i>=0) arr[i]=rec; else arr.push(rec);
 shadow.set(key,j);
 if(k==='places') arr.sort((a,b)=>(a.sort||0)-(b.sort||0));
 return true;
}
async function pull(){
 let changed=false;
 for(const k in KINDS){
  const t=KINDS[k].table; let cur=meta.cursor[t]||'1970-01-01T00:00:00Z';
  for(;;){
   const {data,error}=await sb.from(t).select('*').gt('updated_at',cur).order('updated_at').limit(500);
   if(error) throw error;
   for(const row of data){ if(mergeRow(k,row)) changed=true; cur=row.updated_at; }
   meta.cursor[t]=cur;
   if(data.length<500) break;
  }
 }
 return changed;
}
async function sync(){
 if(DEMO||!sb||!meta.me||noAccess) return;
 if(syncing){ again=true; return; }
 syncing=true; updatePill();
 const before=pendingCount();
 try{
  await pushOutbox(); await pushLogs(); await pushPhotos();
  const changed=await pull();
  if(before && !pendingCount() && lastErr) toast(s('synced')(before));
  lastErr=null; saveLocal();
  if(changed) deferRender();
 }catch(e){
  lastErr=e; console.warn('sync', e);
  if(e && (e.code==='42501' || /row-level security/i.test(e.message||''))){ noAccess=true; showGate(s('noAccess'), true); }
 }finally{
  syncing=false; updatePill();
  if(again){ again=false; schedulePush(); }
 }
}
function subscribe(){
 let ch=sb.channel('work-live');
 for(const k in KINDS){
  ch=ch.on('postgres_changes',{event:'*',schema:'public',table:KINDS[k].table}, p=>{
   if(p.new && p.new.id && mergeRow(k,p.new)){ saveLocal(); deferRender(); }
  });
 }
 ch.subscribe();
}

function photoSrc(path){

 }
 return null;
}

  else if(e.steps.length) h+='<ol class="readsteps">'+e.steps.map(x=>'<li>'+esc(x[lang]||x.en)+'</li>').join('')+'</ol>';
 }
 if(e.type!=='goal'){
  const src=e.newPhoto||photoSrc(e.photo_path);
  h+='<div class="photo"><label>'+esc(s('photo'))+'</label>'+(src?'<img src="'+esc(src)+'" alt="">':'')+'<label class="btn" style="display:inline-block;margin-top:6px;color:var(--ink);font-weight:400">'+esc(s('addPhoto'))+'<input type="file" accept="image/*" capture="environment" name="photo" hidden></label></div>';
 }
 h+='</form><div class="edfoot">'+(e.isNew?'<span></span>':'<button class="btn danger" type="button" data-act="edel">'+esc(e.armed?s('sure'):s('del'))+'</button>')+
  '<span style="display:flex;gap:8px"><button class="btn" type="button" data-act="ecancel">'+esc(s('cancel'))+'</button><button class="btn primary" type="button" data-act="esave">'+esc(s('save'))+'</button></span></div>';
 $('#dlg').innerHTML=h;
}
function readForm(){
 const f=$('#edform'); if(!f||!ed) return; const e=ed, el=f.elements;
 ['en','es'].forEach(k=>{ if(el[k]) e[k]=el[k].value.trim(); });
 if(el.place) e.place=el.place.value||null;
 if(el.system) e.system=el.system.value||null;
 if(el.due) e.due=el.due.value||null;
 if(el.every) e.every=Number(el.every.value);
 if(el.goal) e.goal=el.goal.value||null;
 if(el.stepsEn){ const a=el.stepsEn.value.split('\n'), b=el.stepsEs.value.split('\n'), out=[];
  for(let i=0;i<Math.max(a.length,b.length);i++){ const x=(a[i]||'').trim(), y=(b[i]||'').trim(); if(x||y) out.push({en:x,es:y}); } e.steps=out; }
}
function openPlaceEditor(p,parent){
 ed=null;
 edPlace=p?Object.assign({},p):{id:uid('p'),en:'',es:'',kind:'area',parent:parent||null,sort:state.places.reduce((m,x)=>Math.max(m,x.sort||0),0)+1,isNew:true};
 edPlace.armed=false; drawPlaceEditor();

}
function drawPlaceEditor(){

 $('#dlg').innerHTML='<form class="ed" id="plform"><h3>'+esc(p.isNew?s('addPlace').replace('+ ',''):s('editPlace'))+'</h3>'+
  '<label>'+esc(s('placeName'))+' · English<input type="text" name="en" value="'+esc(p.en)+'"></label>'+
  '<label>'+esc(s('placeName'))+' · Español<input type="text" name="es" value="'+esc(p.es)+'"></label>'+

  '<label>'+esc(s('inside'))+'<select name="parent"><option value="">'+esc(s('top'))+'</option>'+placeOpts(p.parent,p.id)+'</select></label></div></form>'+
  '<div class="edfoot">'+(p.isNew?'<span></span>':'<button class="btn danger" type="button" data-act="pdel">'+esc(p.armed?s('sure'):s('del'))+'</button>')+

async function openInvite(h){
 if(!navigator.onLine){ toast(s('needOnline')); return; }
 const bytes=crypto.getRandomValues(new Uint8Array(18));
 const token=btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const {error}=await sb.from('work_invites').insert({token,helper_id:h.id,created_by:myName()});
 if(error){ console.warn(error); toast(s('needOnline')); return; }
 const link=location.origin+location.pathname+'#join='+token;
 const msg=STR[h.lang].inviteMsg(h.name,link), num=(h.phone||'').replace(/\D/g,'');
 ed=null; edPlace=null;
 $('#dlg').innerHTML='<div class="ed"><h3>'+esc(s('inviteTitle')(h.name))+'</h3><p class="hint" style="margin:0">'+esc(s('inviteHelp'))+'</p>'+
  '<input type="text" readonly value="'+esc(link)+'" id="invLink" style="border:1px solid var(--line2);background:var(--raised);border-radius:8px;padding:9px 10px;width:100%;font-size:14px">'+
  '<div class="tools" style="margin:0"><a class="wa" href="'+esc('https://wa.me/'+num+'?text='+encodeURIComponent(msg))+'" target="_blank" rel="noopener">'+WA+esc(s('sendWa'))+'</a><button class="btn" type="button" data-act="copylink">'+esc(s('copy'))+'</button></div></div>'+
  '<div class="edfoot"><span></span><button class="btn" type="button" data-act="ecancel">'+esc(s('close'))+'</button></div>';
 if(!$('#dlg').open) $('#dlg').showModal();
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('button,[data-place]'); if(!b||!b.closest('#app,#dlg,#toast')) return;
 const d=b.dataset;
 if(d.tab){ ui.tab=d.tab; ui.place=null; renderAll(); window.scrollTo(0,0); if(d.tab==='people') loadDevices(); return; }
 if(d.viewas){ state.viewer=d.viewas; ui.full=false; ui.who='all'; armed=null; saveLocal(); renderAll(); return; }
 if(d.who){ ui.who=d.who; renderAll(); return; }
 if(d.place!==undefined){ ui.place=d.place||null; renderAll(); return; }
 if(d.sys){ ui.sys=ui.sys===d.sys?null:d.sys; renderAll(); return; }
 if(d.invite){ openInvite(helper(d.invite)); return; }
 if(d.unlink){ const {error}=await sb.from('work_devices').delete().eq('helper_id',d.unlink); if(error){ toast(s('needOnline')); return; } toast(s('unlinked')); loadDevices(); return; }
 if(d.rmperson){
  if(armed!==d.rmperson){ armed=d.rmperson; renderAll(); return; }
  const p=helper(d.rmperson), snap=snapshot();
  state.helpers=state.helpers.filter(x=>x.id!==p.id);
  state.items.forEach(it=>{ it.who=it.who.filter(w=>w!==p.id); });
  state.animals.forEach(a=>{ if(a.owner===p.id) a.owner='ranch'; });
  armed=null; commit(); toast(s('removed')(p.name),snap);
  if(!DEMO&&sb){ sb.from('work_invites').delete().eq('helper_id',p.id).then(()=>{}); sb.from('work_devices').delete().eq('helper_id',p.id).then(()=>{}); }
  return;
 }
 if(d.rmanimal){
  if(armedA!==d.rmanimal){ armedA=d.rmanimal; renderAll(); return; }
  const an=animal(d.rmanimal), snap=snapshot();
  state.animals=state.animals.filter(x=>x.id!==an.id); state.items.forEach(it=>{ it.animals=it.animals.filter(x=>x!==an.id); });
  armedA=null; commit(); toast(s('removed')(an.name),snap); return;
 }
 if(d.etype){ readForm(); ed.type=d.etype; if(ed.type==='routine'&&!ed.every) ed.every=7; drawEditor(); return; }
 if(d.ewho){ readForm(); const i=ed.who.indexOf(d.ewho); if(i>=0) ed.who.splice(i,1); else ed.who.push(d.ewho); drawEditor(); return; }
 if(d.eanimal){ readForm(); const j=ed.animals.indexOf(d.eanimal); if(j>=0) ed.animals.splice(j,1); else ed.animals.push(d.eanimal); drawEditor(); return; }
 const act=d.act;
 if(act==='check'){
  const it=item(b.closest('[data-id]').dataset.id), snap=snapshot(), now=new Date().toISOString();
  const log=action=>meta.logs.push({id:uid('l'),item_id:it.id,action,helper_id:meta.me||viewer().id,at:now});
  if(it.type==='task'){ it.done=!it.done; it.doneAt=it.done?iso(T0):null; log(it.done?'done':'undone'); commit(); if(it.done) toast(s('done'),snap); }
  else if(doneToday(it)){ it.lastDone=null; it.due=iso(T0); log('undone'); commit(); }
  else { it.lastDone=iso(T0); it.due=add(it.every||1); log('done'); commit(); toast(s('nextDue')(dueLabel(it.due).t.toLowerCase()),snap); }
  return;
 }
 if(act==='edit'){ openEditor(item(b.closest('[data-id]').dataset.id)); return; }
 if(act==='addgoal'){ const g=item(d.goal); openEditor(null,{goal:g.id,place:g.place}); return; }
 if(act==='editgoal'){ openEditor(item(d.goal)); return; }
 if(act==='addplace'){ openPlaceEditor(null,d.parent||null); return; }
 if(act==='editplace'){ openPlaceEditor(place(d.pid)); return; }
 if(act==='full'){ ui.full=!ui.full; renderAll(); return; }
 if(act==='undo'){ const t=$('#toast'); if(t._snap){ restore(t._snap); commit(); } t.hidden=true; return; }
 if(act==='reset'){ state=seed(); meta=freshMeta(); rebuildShadow(); ui={tab:'today',who:'all',place:null,sys:null,full:false}; saveLocal(); renderAll(); return; }
 if(act==='signout'){ await sb.auth.signOut(); localStorage.removeItem(LKEY); location.reload(); return; }
 if(act==='copylink'){ const inp=$('#invLink'); try{ await navigator.clipboard.writeText(inp.value); }catch(e){ inp.select(); document.execCommand('copy'); } toast(s('copied')); return; }
 if(act==='ecancel'){ $('#dlg').close(); return; }
 if(act==='edel'){
  if(!ed.armed){ ed.armed=true; drawEditor(); return; }
  const snap=snapshot(), id=ed.id;
  state.items=state.items.filter(x=>x.id!==id); state.items.forEach(x=>{ if(x.goal===id) x.goal=null; });
  $('#dlg').close(); commit(); toast(s('del'),snap); return;
 }
 if(act==='esave'){
  readForm(); if(!ed.en&&!ed.es){ const inp=$('#edform input[type=text]'); if(inp) inp.focus(); return; }
  const clean=JSON.parse(JSON.stringify(ed));
  if(clean.newPhoto){ const path='items/'+clean.id+'/'+Date.now().toString(36)+'.jpg'; meta.photos[path]=clean.newPhoto; photoUrls[path]=clean.newPhoto; clean.photo_path=path; }
  delete clean.isNew; delete clean.armed; delete clean.newPhoto;
  if(clean.type!=='routine') clean.every=null;
  if(clean.type==='goal'){ clean.due=null; clean.goal=null; }
  const ix=state.items.findIndex(x=>x.id===clean.id);
  if(ix>=0) state.items[ix]=clean; else state.items.push(clean);
  $('#dlg').close(); commit(); return;
 }
 if(act==='pdel'){
  if(!edPlace.armed){ edPlace.armed=true; drawPlaceEditor(); return; }
  const snap=snapshot(), p=edPlace;
  state.places=state.places.filter(x=>x.id!==p.id); state.places.forEach(x=>{ if(x.parent===p.id) x.parent=p.parent||null; });
  if(ui.place===p.id) ui.place=p.parent||null;
  $('#dlg').close(); commit(); toast(s('del'),snap); return;
 }
 if(act==='psave'){
  const f=$('#plform').elements, p=edPlace;
  p.en=f.en.value.trim(); p.es=f.es.value.trim(); p.kind=f.kind.value; p.parent=f.parent.value||null;
  if(!p.en&&!p.es){ f.en.focus(); return; }
  const clean=Object.assign({},p); delete clean.isNew; delete clean.armed;
  const ix=state.places.findIndex(x=>x.id===clean.id);
  if(ix>=0) state.places[ix]=clean; else state.places.push(clean);
  $('#dlg').close(); commit(); return;
 }
});

 if(DEMO){ meta.online=!meta.online; if(meta.online&&meta.pending){ const n=meta.pending; meta.pending=0; saveLocal(); renderAll(); toast(s('synced')(n)); return; } saveLocal(); renderAll(); return; }
 sync();
});
document.addEventListener('submit',ev=>{
 const f=ev.target;
 if(f.id==='edform'){ ev.preventDefault(); const sv=document.querySelector('[data-act="esave"]'); if(sv) sv.click(); return; }
 if(f.id==='plform'){ ev.preventDefault(); const sv=document.querySelector('[data-act="psave"]'); if(sv) sv.click(); return; }
 if(f.id==='addanimal'){ ev.preventDefault(); const na=f.elements.name.value.trim(); if(!na) return; state.animals.push({id:uid('a'),sp:f.elements.sp.value,name:na,owner:'ranch',home:null,notes:null}); commit(); return; }
 if(f.id==='addperson'){ ev.preventDefault(); const name=f.elements.name.value.trim(); if(!name) return;
  state.helpers.push({id:uid('h'),name,role:f.elements.role.value,lang:f.elements.lang.value,phone:f.elements.phone.value.trim()||null,email:f.elements.email.value.trim().toLowerCase()||null}); commit(); }
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 const ar=t.closest&&t.closest('[data-aid]');
 if(ar&&t.dataset.af){ const a=animal(ar.dataset.aid), v=t.value.trim(); if(t.dataset.af==='name'&&!v) return; a[t.dataset.af]=t.dataset.af==='home'?(v||null):v; commit(); return; }
 const hr=t.closest&&t.closest('[data-hid]');
 if(hr&&t.dataset.hf){ const h=helper(hr.dataset.hid); h[t.dataset.hf]=t.value.trim()||null; if(t.dataset.hf!=='phone'&&!h[t.dataset.hf]) return; commit(); return; }
 if(t.name!=='photo'||!ed) return;
 const file=t.files&&t.files[0]; if(!file) return;
 readForm();
 const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
  const k=Math.min(1,960/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); ed.newPhoto=c.toDataURL('image/jpeg',.72); drawEditor(); }; img.src=r.result; };
 r.readAsDataURL(file);
});
$('#dlg').addEventListener('close',()=>{ ed=null; edPlace=null; });
window.addEventListener('online',()=>{ updatePill(); sync(); });
window.addEventListener('offline',updatePill);

setInterval(()=>{ if(document.visibilityState==='visible') sync(); }, 45000);

/* ---------- sign in ---------- */
// Give up after 15 s so a blocked connection shows a message instead of spinning forever.
const within=(p,ms=15000)=>Promise.race([p,new Promise(r=>setTimeout(()=>r({error:{timeout:true}}),ms))]);
const NO_SERVER='Can’t reach the server. Try again near the house Wi-Fi. On an iPhone, turn off Settings → Wi-Fi → ⓘ → Limit IP Address Tracking. · No se pudo conectar. Intenta otra vez cerca del Wi-Fi de la casa.';
function showGate(text, withSignOut){
 $('#app').hidden=true; $('#gate').hidden=false;
 $('#gateLogin').hidden=!!text; $('#gateMsg').hidden=!text;
 if(text){ $('#gateText').textContent=text; $('#gateOut').hidden=!withSignOut; }
}
function showLogin(){
 showGate(null);
 let email='', busy=false;
 const err=t=>{ $('#gateErr').textContent=t||''; $('#gateErr').hidden=!t; };
 const readEmail=()=>{ email=$('#email').value.trim().toLowerCase(); if(!email.includes('@')){ $('#email').focus(); err('Type your email first. · Escribe tu correo primero.'); return false; } return true; };
 const toCode=msg=>{ $('#stepEmail').hidden=true; $('#stepCode').hidden=false; $('#codeMsg').textContent=msg; $('#code').value=''; $('#code').focus(); };
 $('#sendCode').onclick=async()=>{
  if(busy||!readEmail()) return; err('');
  const b=$('#sendCode'); busy=true; b.disabled=true; b.textContent='Sending… · Enviando…';
  const {error}=await within(sb.auth.signInWithOtp({email, options:{emailRedirectTo:location.origin+location.pathname}}));
  busy=false; b.disabled=false; b.textContent='Send me a code · Mandar código';
  if(error){
   if(error.timeout) return err(NO_SERVER);
   if(error.status===429||/rate limit/i.test(error.message)) return err('Too many codes asked for. Use the code from the newest email you already got (tap “I already have a code”), or wait an hour. · Demasiados códigos. Usa el código del correo más nuevo o espera una hora.');
   return err(error.message);
  }
  toCode('Code sent to '+email+'. Use the NEWEST email: Gmail stacks these together and older codes don’t work. · Usa el correo MÁS NUEVO.');
 };
 $('#haveCode').onclick=()=>{ if(!readEmail()) return; err(''); toCode('Type the code from the newest email sent to '+email+'. · Escribe el código del correo más nuevo.'); };
 $('#email').onkeydown=e=>{ if(e.key==='Enter') $('#sendCode').click(); };
 $('#verify').onclick=async()=>{
  if(busy) return;
  const token=$('#code').value.replace(/\D/g,''); if(!token){ $('#code').focus(); return; }
  const b=$('#verify'); busy=true; b.disabled=true; b.textContent='Checking… · Revisando…'; err('');
  const {error}=await within(sb.auth.verifyOtp({email, token, type:'email'}));
  if(error){
   busy=false; b.disabled=false; b.textContent='Sign in · Entrar';
   if(error.timeout) return err(NO_SERVER);
   return err('That code didn’t work. Open the NEWEST email (Gmail stacks them — scroll to the bottom of the thread) and type that code. Codes last one hour. · Ese código no funcionó. Usa el correo más nuevo.');
  }
  b.textContent='Signed in · Adentro';
  location.reload();
 };
 $('#code').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#verify').click(); } };
 $('#otherEmail').onclick=()=>{ err(''); $('#stepEmail').hidden=false; $('#stepCode').hidden=true; };
}
$('#gateOut').addEventListener('click',async()=>{ if(sb) await sb.auth.signOut(); localStorage.removeItem(LKEY); location.reload(); });

function startApp(welcome){
 $('#gate').hidden=true; $('#app').hidden=false;
 if(!helper(state.viewer)) state.viewer=meta.me||(state.helpers[0]&&state.helpers[0].id)||null;
 renderAll();
 if(welcome) toast(welcome);
}
async function boot(){
 loadLocal();
 if(DEMO){ startApp(); return; }
 if(!window.supabase){ if(meta.me){ startApp(); return; } showGate('No connection. Open this near the house the first time. · Sin conexión. Ábrelo cerca de la casa la primera vez.'); return; }
 sb=supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
 const join=(location.hash.match(/join=([\w-]+)/)||[])[1];
 let {data:{session}}=await sb.auth.getSession();
 let welcome=null;
 if(join){
  history.replaceState(null,'',location.pathname+location.search);
  try{
   if(!session){ const r=await sb.auth.signInAnonymously(); if(r.error) throw r.error; session=r.data.session; }
   const {data,error}=await sb.rpc('work_claim_invite',{p_token:join}); if(error) throw error;
   if(meta.me && meta.me!==data.id){ state={places:[],helpers:[],animals:[],items:[],viewer:null}; meta=freshMeta(); rebuildShadow(); }
   meta.me=data.id; state.viewer=data.id; saveLocal();
   welcome=STR[data.lang].welcome(data.name);
  }catch(e){
   console.warn(e);
   const off=/anonymous/i.test(e.message||'');
   return showGate(off ? 'Invite links are switched off. Ask Will. · Los enlaces están apagados. Avísale a Will.' : 'This link doesn’t work anymore. Ask Walker for a new one. · Este enlace ya no funciona. Pídele uno nuevo a Walker.', !!session);
  }
 }
 if(!session){ if(meta.me && !navigator.onLine){ startApp(); return; } return showLogin(); }
 try{
  const {data,error}=await sb.rpc('work_me'); if(error) throw error;
  if(!data) return showGate('This account isn’t on the ranch list yet. Ask Will to add your email in People. · Esta cuenta no está en la lista.', true);
  if(meta.me && meta.me!==data){ state={places:[],helpers:[],animals:[],items:[],viewer:null}; meta=freshMeta(); rebuildShadow(); }
  meta.me=data; if(!state.viewer) state.viewer=data; saveLocal();
 }catch(e){
  if(!meta.me) return showGate('No connection. Open this near the house the first time. · Sin conexión. Ábrelo cerca de la casa la primera vez.');
 }
 startApp(welcome);
 syncing=false; await sync();
 if(!helper(state.viewer)) state.viewer=meta.me;
 renderAll();
 subscribe();
}
if('serviceWorker' in navigator && !DEMO && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('hashchange',()=>{ if(/join=/.test(location.hash)) location.reload(); });
window.__work={get state(){return state},get meta(){return meta},sync};
boot();
})();
</script>
