<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Wild Horse Family Tree</title>
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/mark.jpg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12100a; --surface:#1e1608; --card:#2a1e0d; --line:#5a3e1e;
  --accent:#c8832a; --accent-2:#e8a84a; --text:#f0e0c0; --muted:#a88660;
  --stallion:#5a8ad0; --mare:#d05a9a; --gelding:#5aaa70; --unknown:#9a8a6a;
  --danger:#d06050;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* ── header ── */
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#2a1e0d,#12100a);border-bottom:2px solid var(--accent);padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:1.15rem;color:var(--accent-2);line-height:1.1}
header .sub{font-size:.72rem;color:var(--muted);font-style:italic}
.hdr-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:.8rem;min-height:34px}
.chip.on{background:var(--accent);color:#1a0f05;border-color:var(--accent-2);font-weight:bold}

/* ── toolbar ── */
.bar{display:flex;gap:8px;padding:10px 14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:57px;z-index:40}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:8px 14px;font-size:.88rem;min-height:40px}
.seg button.on{background:var(--accent);color:#1a0f05;font-weight:bold}
.search{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;outline:none}
.search:focus{border-color:var(--accent)}

/* ── buttons ── */
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:.92rem;min-height:44px}
.btn:hover{border-color:var(--accent);color:var(--accent-2)}
.btn-primary{background:var(--accent);border-color:var(--accent-2);color:#1a0f05;font-weight:bold}
.btn-primary:hover{background:var(--accent-2);color:#1a0f05}
.btn-danger{background:#3a120e;border-color:#7a2a22;color:#ffb8a8}
.btn:disabled{opacity:.5;cursor:default}
.fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-b));z-index:60;border-radius:999px;padding:14px 22px;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.6)}

/* ── herd view ── */
#herd{padding:6px 14px calc(100px + var(--safe-b))}
.band-h{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px;color:var(--accent-2);font-size:1rem;border-bottom:1px solid var(--line);padding-bottom:4px}
.band-h small{color:var(--muted);font-size:.78rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;min-width:0}
.hc:hover{border-color:var(--accent)}
.hc .av{border:3px solid var(--unknown)}
.hc.stallion .av{border-color:var(--stallion)} .hc.mare .av{border-color:var(--mare)} .hc.gelding .av{border-color:var(--gelding)}
.hc.gone{opacity:.6}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;background:var(--surface);border:2px solid var(--line)}
.av.none{filter:grayscale(1) sepia(.35);opacity:.38}
.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0}
.poster{display:block;width:min(220px,62vw);margin:0 auto 6px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.empty .poster{width:min(170px,50vw);opacity:.9;margin-bottom:14px}
.hc .nm{font-weight:bold;color:var(--accent-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .mt{font-size:.74rem;color:var(--muted);line-height:1.45;margin-top:2px}
.tag{display:inline-block;font-size:.66rem;padding:2px 7px;border-radius:999px;margin-top:5px;border:1px solid var(--line);color:var(--muted)}
.tag.missing{color:#e8c070;border-color:#7a6030}
.tag.deceased{color:#b0a090}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.7}
.empty .big{font-size:4.5rem;opacity:.3}

/* ── tree view ── */
#tree{position:fixed;inset:0;top:118px;background:var(--bg);touch-action:none}
#tree svg{width:100%;height:100%;display:block;cursor:grab}
.tlink{fill:none;stroke-width:2.2;stroke-opacity:.75}
.tlink.sire{stroke:var(--stallion)} .tlink.dam{stroke:var(--mare)}
.tnode{cursor:pointer}
.tnode rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.tnode:hover rect{stroke:var(--accent)}
.tnode.sel rect{stroke:var(--accent-2);stroke-width:3}
.tnode text{fill:var(--text);font-family:Georgia,serif;text-anchor:middle}
.tnode .tn{fill:var(--accent-2);font-weight:bold;font-size:14px}
.tnode .tm{fill:var(--muted);font-size:11px}
.legend{position:absolute;left:12px;top:10px;background:rgba(30,22,8,.92);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.74rem;color:var(--muted);pointer-events:none}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.tnote{position:absolute;left:12px;bottom:calc(84px + var(--safe-b));right:70px;font-size:.78rem;color:var(--muted);pointer-events:none}
.zoom{position:absolute;right:18px;bottom:calc(84px + var(--safe-b));display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:10px;background:rgba(30,22,8,.92);border:1px solid var(--line);font-size:1.2rem}

/* ── sheets (bottom on phone, side on desktop) ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--surface);border-top:2px solid var(--accent);border-radius:18px 18px 0 0;z-index:110;padding:18px 18px calc(22px + var(--safe-b));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:760px){
  .sheet{left:auto;top:0;width:420px;max-height:none;border-top:0;border-left:2px solid var(--accent);border-radius:0;animation:none}
}
.sheet h2{color:var(--accent-2);font-size:1.3rem;margin-bottom:2px;padding-right:40px}
.sheet .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:10px;background:none;border:0;font-size:1.6rem;color:var(--muted)}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
.val{font-size:.95rem;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.link{background:none;border:0;color:var(--accent-2);text-decoration:underline;text-underline-offset:3px;padding:3px 0;text-align:left;display:block}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card);border:2px solid var(--line)}
.photos .ph.cover{border-color:var(--accent-2)}
.photos img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.hero{width:100%;max-height:48vh;object-fit:cover;border-radius:12px;display:block;margin:8px 0 4px;cursor:zoom-in;background:var(--card)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}

/* ── form ── */
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.fg input:not([type=checkbox]),.fg select,.fg textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;outline:none;min-height:44px}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}
.fg textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:.88rem;margin-top:6px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.pgrid .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:var(--card)}
.pgrid .ph.cover{border-color:var(--accent-2)}
.pgrid img{width:100%;height:100%;object-fit:cover}
.pgrid .ph button{position:absolute;background:rgba(0,0,0,.72);border:0;border-radius:8px;font-size:.72rem;padding:4px 7px}
.pgrid .ph .rm{top:4px;right:4px}
.pgrid .ph .cv{bottom:4px;left:4px}
.pgrid .add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-style:dashed;color:var(--muted);font-size:.8rem;cursor:pointer}
.pgrid .add span{font-size:1.8rem}
.busy{opacity:.55}

/* ── login ── */
.login{max-width:380px;margin:12vh auto 0;padding:24px;text-align:center}
.login .big{font-size:4rem}
.login h1{color:var(--accent-2);margin:6px 0}
.login p{color:var(--muted);line-height:1.6;margin:10px 0 18px;font-size:.95rem}
.login input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:18px;text-align:center;outline:none;margin-bottom:10px}
.login input.code{letter-spacing:.4em;font-size:24px}
.login .btn{width:100%}
.login .lang{margin-top:22px}

.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);color:var(--accent-2);padding:10px 18px;border-radius:10px;z-index:300;font-size:.92rem;max-width:90vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.banner{margin:10px 14px 0;padding:12px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--card);font-size:.9rem;line-height:1.5}
.banner .btn{margin-top:8px;margin-right:6px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:400;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login" hidden>
  <div class="login">
    <img class="poster" src="img/poster.jpg" alt="">
    <h1 data-t="title"></h1>
    <div id="login-email">
      <p data-t="loginIntro"></p>
      <input id="email" type="email" autocomplete="email" inputmode="email" data-ph="emailPh">
      <button class="btn btn-primary" id="send-code" data-t="sendCode"></button>
    </div>
    <div id="login-code" hidden>
      <p id="code-msg"></p>
      <input id="code" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="••••••">
      <button class="btn btn-primary" id="verify-code" data-t="verify"></button>
      <button class="btn" id="back-email" style="margin-top:8px" data-t="differentEmail"></button>
    </div>
    <div class="lang"><button class="chip" data-lang-toggle></button></div>
  </div>
</div>

<!-- ═══ NOT ON LIST ═══ -->
<div id="denied" hidden>
  <div class="login">
    <div class="big">🔒</div>
    <h1 data-t="deniedTitle"></h1>
    <p id="denied-msg"></p>
    <button class="btn" id="denied-out" data-t="signOut"></button>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" hidden>
  <header>
    <img class="logo" src="img/mark.jpg" alt="">
    <div><h1 data-t="title"></h1><div class="sub" id="stats"></div></div>
    <div class="hdr-right">
      <button class="chip" data-lang-toggle></button>
      <button class="chip" id="menu-btn" aria-label="Menu">☰</button>
    </div>
  </header>
  <div class="bar">
    <div class="seg">
      <button data-view="herd" class="on" data-t="herdView"></button>
      <button data-view="tree" data-t="treeView"></button>
    </div>
    <input class="search" id="search" type="search" data-ph="searchPh">
  </div>
  <div id="banner-slot"></div>
  <main id="herd"></main>
  <div id="tree" hidden>
    <svg><g id="tg"><g id="tlinks"></g><g id="tnodes"></g></g></svg>
    <div class="legend"><div><i style="background:var(--stallion)"></i><span data-t="sireLine"></span></div><div><i style="background:var(--mare)"></i><span data-t="damLine"></span></div></div>
    <div class="zoom"><button id="zin">+</button><button id="zout">−</button><button id="zfit">⊡</button></div>
    <div class="tnote" id="tnote"></div>
  </div>
  <button class="btn btn-primary fab" id="add-btn" data-t="addHorse"></button>
</div>

<div id="sheet-slot"></div>

const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,ms=2800){ document.querySelectorAll('.toast').forEach(n=>n.remove()); const n=document.createElement('div'); n.className='toast'; n.textContent=msg; document.body.appendChild(n); setTimeout(()=>n.remove(),ms); }

const SEX_EMOJI={stallion:'♂',mare:'♀',gelding:'⚲',unknown:'?'};

// Shrink a phone photo before upload: long edge px → JPEG blob
async function shrink(file, edge, quality){
  let src;
  try{ src = await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){
    src = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  }
  const w=src.width, h=src.height, k=Math.min(1, edge/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',quality));
}

// ═══════════════════════════════════════════════════════════════
const configured = !SUPABASE_URL.startsWith('PASTE');
const DEMO = new URLSearchParams(location.search).has('demo') || !configured && location.protocol==='file:';
let sb = null, me = null;

const store = DEMO ? (()=>{
  const blobs = {};
  const uid = ()=>crypto.randomUUID();
  const now = ()=>new Date().toISOString();
  const data = { bands:[], horses:[], horse_photos:[] };
  return {
    async load(){ return structuredClone(data); },
    async upsert(table,row){ row={...row, id:row.id||uid(), updated_at:now()}; const a=data[table]; const i=a.findIndex(r=>r.id===row.id); if(i>=0) a[i]={...a[i],...row}; else a.push(row); return structuredClone(row); },
    async remove(table,id){ data[table]=data[table].filter(r=>r.id!==id); if(table==='horses'){ data.horse_photos=data.horse_photos.filter(p=>p.horse_id!==id); data.horses.forEach(h=>{ if(h.sire_id===id) h.sire_id=null; if(h.dam_id===id) h.dam_id=null; }); } if(table==='bands') data.horses.forEach(h=>{ if(h.band_id===id) h.band_id=null; }); },
    async uploadFile(path,blob){ blobs[path]=URL.createObjectURL(blob); },
    async removeFiles(paths){ paths.forEach(p=>delete blobs[p]); },
    async urls(paths){ const m={}; paths.forEach(p=>m[p]=blobs[p]); return m; },
    subscribe(){}
  };
})() : {
  async load(){
    const [b,h,p] = await Promise.all(['bands','horses','horse_photos'].map(tb=>sb.from(tb).select('*')));
    for(const r of [b,h,p]) if(r.error) throw r.error;
    return { bands:b.data, horses:h.data, horse_photos:p.data };
  },
  async upsert(table,row){
    row={...row, updated_by:me.email}; if(table!=='horse_photos') row.updated_at=new Date().toISOString(); else { delete row.updated_by; row.created_by=me.email; }
    const {data,error} = await sb.from(table).upsert(row).select().single();
    if(error) throw error; return data;
  },
  async remove(table,id){ const {error}=await sb.from(table).delete().eq('id',id); if(error) throw error; },
  async uploadFile(path,blob){ const {error}=await sb.storage.from('horse-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false}); if(error) throw error; },
  async removeFiles(paths){ if(paths.length){ const {error}=await sb.storage.from('horse-photos').remove(paths); if(error) throw error; } },
  async urls(paths){
    const m={}; if(!paths.length) return m;
    const {data,error}=await sb.storage.from('horse-photos').createSignedUrls(paths,60*60*6);
    if(error) throw error; data.forEach(d=>{ if(d.signedUrl) m[d.path]=d.signedUrl; }); return m;
  },
  subscribe(fn){
    let tmr; const kick=()=>{ clearTimeout(tmr); tmr=setTimeout(fn,600); };
    sb.channel('herd').on('postgres_changes',{event:'*',schema:'public'},kick).subscribe();
  }
};

// ═══════════════════════════════════════════════════════════════
//  TREE VIEW — generations top to bottom, both parents drawn
// ═══════════════════════════════════════════════════════════════
const NW=150, NH=74, GX=26, GY=90;
let zoom, fitT=d3.zoomIdentity, treeFitted=false;
function initTree(){
  const svg=d3.select('#tree svg');
  zoom=d3.zoom().scaleExtent([0.1,3]).on('zoom',ev=>d3.select('#tg').attr('transform',ev.transform));
  svg.call(zoom).on('dblclick.zoom',null);
  $('#zin').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.35);
  $('#zout').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.35);
  $('#zfit').onclick=()=>svg.transition().duration(400).call(zoom.transform,fitT);
}
function renderTree(){
  const ids=new Set(S.horses.map(h=>h.id));
  const par=h=>[h.sire_id,h.dam_id].filter(p=>p&&ids.has(p));
  const linked=S.horses.filter(h=>par(h).length||S.horses.some(k=>par(k).includes(h.id)));
  const loners=S.horses.length-linked.length;
  $('#tnote').textContent = linked.length?t('treeNote',loners):t('treeEmpty');

  // generation = 1 + deepest parent
  const gen={};
  const g=(h,seen=new Set())=>{ if(gen[h.id]!=null) return gen[h.id]; if(seen.has(h.id)) return 0; seen.add(h.id); const ps=par(h).map(H); return gen[h.id]= ps.length?1+Math.max(...ps.map(p=>g(p,seen))):0; };
  linked.forEach(h=>g(h));
  // pull parentless horses down to sit one row above their first foal
  linked.forEach(h=>{ if(!par(h).length){ const kids=linked.filter(k=>par(k).includes(h.id)); if(kids.length) gen[h.id]=Math.max(0,Math.min(...kids.map(k=>gen[k.id]))-1); } });

  const rows=[]; linked.forEach(h=>(rows[gen[h.id]]??=[]).push(h));
  rows.forEach(r=>r&&r.sort((a,b)=>(a.band_id||'').localeCompare(b.band_id||'')||byName(a,b)));
  const pos={};
  const place=()=>rows.forEach((r,y)=>r&&r.forEach((h,i)=>pos[h.id]={x:(i-(r.length-1)/2)*(NW+GX),y:y*(NH+GY)}));
  place();
  // order children under their parents, parents above their foals
  for(let pass=0;pass<4;pass++){
    rows.forEach((r,y)=>{ if(!r||!y) return; r.sort((a,b)=>center(a,par)-center(b,par)); }); place();
    for(let y=rows.length-2;y>=0;y--){ const r=rows[y]; if(!r) continue; r.sort((a,b)=>kidCenter(a)-kidCenter(b)); } place();
  }
  function center(h,par){ const ps=par(h).filter(p=>pos[p]); return ps.length?ps.reduce((s,p)=>s+pos[p].x,0)/ps.length:pos[h.id].x; }
  function kidCenter(h){ const ks=linked.filter(k=>par(k).includes(h.id)); return ks.length?ks.reduce((s,k)=>s+pos[k.id].x,0)/ks.length:pos[h.id].x; }

  const links=[]; linked.forEach(k=>{ if(k.sire_id&&pos[k.sire_id]) links.push({s:k.sire_id,t:k.id,c:'sire'}); if(k.dam_id&&pos[k.dam_id]) links.push({s:k.dam_id,t:k.id,c:'dam'}); });
  d3.select('#tlinks').selectAll('path').data(links).join('path')
    .attr('class',d=>'tlink '+d.c)
    .attr('d',d=>{ const a=pos[d.s], b=pos[d.t], off=a.x<b.x?-8:a.x>b.x?8:(d.c==='sire'?-8:8), y1=a.y+NH/2, y2=b.y-NH/2, my=(y1+y2)/2; return `M${a.x},${y1} C${a.x},${my} ${b.x+off},${my} ${b.x+off},${y2}`; });

  const nodes=d3.select('#tnodes').selectAll('g.tnode').data(linked,d=>d.id).join(enter=>{
    const n=enter.append('g').attr('class','tnode');
    n.append('rect').attr('x',-NW/2).attr('y',-NH/2).attr('width',NW).attr('height',NH).attr('rx',12);
    n.append('clipPath').attr('id',d=>'c'+d.id).append('circle').attr('cx',-NW/2+34).attr('cy',0).attr('r',24);
    n.append('circle').attr('cx',-NW/2+34).attr('cy',0).attr('r',25).style('fill','var(--surface)').style('stroke','var(--line)');
    n.append('image').attr('x',-NW/2+10).attr('y',-24).attr('width',48).attr('height',48).attr('preserveAspectRatio','xMidYMid slice').attr('clip-path',d=>`url(#c${d.id})`);
    n.append('circle').attr('class','ring').attr('cx',-NW/2+34).attr('cy',0).attr('r',25).style('fill','none').style('stroke-width',3);
    n.append('text').attr('class','tn').attr('x',28).attr('y',-4);
    n.append('text').attr('class','tm').attr('x',28).attr('y',15);
    n.on('click',(ev,d)=>{ ev.stopPropagation(); showHorse(d.id); });
    return n;
  });
  nodes.attr('transform',d=>`translate(${pos[d.id].x},${pos[d.id].y})`).classed('sel',d=>d.id===selectedId).style('opacity',d=>d.status==='deceased'?.6:1);
  nodes.select('circle.ring').style('stroke',d=>`var(--${d.sex||'unknown'})`);
  const coverUrl=d=>{ const c=coverOf(d); return c&&URLS[c.thumb_path]||null; };
  nodes.select('image').attr('href',d=>coverUrl(d)||'img/mark.jpg')
    .style('filter',d=>coverUrl(d)?null:'grayscale(1) sepia(.35)').style('opacity',d=>coverUrl(d)?1:.38);
  nodes.select('text.tn').text(d=>d.name.length>11?d.name.slice(0,10)+'…':d.name);
  nodes.select('text.tm').text(d=>metaLine(d));

  $('#tree').style.top = $('.bar').getBoundingClientRect().bottom+'px';
  if(!linked.length) return;
  const xs=linked.map(h=>pos[h.id].x), ys=linked.map(h=>pos[h.id].y);
  const minX=Math.min(...xs)-NW/2, maxX=Math.max(...xs)+NW/2, minY=Math.min(...ys)-NH/2, maxY=Math.max(...ys)+NH/2;
  const el=$('#tree'), cw=el.clientWidth, ch=el.clientHeight-70;
  const k=Math.min(.92*cw/(maxX-minX), .9*ch/(maxY-minY), 1.2);
  fitT=d3.zoomIdentity.translate(cw/2-k*(minX+maxX)/2, 60-k*minY).scale(k);
  if(!treeFitted){ d3.select('#tree svg').call(zoom.transform,fitT); treeFitted=true; }
}

function editHorse(id, opts={}){
  const h = id?structuredClone(H(id)):{ name:'', sex:'unknown', status:'here', birth_year_approx:false };
  if(opts.parent){ if(opts.parent.sex==='stallion') h.sire_id=opts.parent.id; else if(opts.parent.sex==='mare') h.dam_id=opts.parent.id; h.band_id=opts.parent.band_id; }
  // photos: existing rows + new files waiting for upload

  sheet(`

    <div class="row2">
      <div class="fg"><label>${t('sex')}</label><select id="f-sex">${['unknown','stallion','mare','gelding'].map(s=>`<option value="${s}" ${h.sex===s?'selected':''}>${t(s)}</option>`).join('')}</select></div>
      <div class="fg"><label>${t('status')}</label><select id="f-status">${['here','missing','deceased'].map(s=>`<option value="${s}" ${h.status===s?'selected':''}>${t(s)}</option>`).join('')}</select></div>

      <div class="fg"><label>${t('year')}</label><input id="f-year" type="number" inputmode="numeric" min="1950" max="2100" value="${h.birth_year??''}">
        <label class="chk"><input type="checkbox" id="f-approx" ${h.birth_year_approx?'checked':''}> ${t('yearApprox')}</label></div>
      <div class="fg"><label>${t('lastSeen')}</label><input id="f-seen" type="date" value="${h.last_seen??''}"></div>
    </div>
    <div class="fg"><label>${t('band')}</label><select id="f-band"><option value="">${t('noBandOpt')}</option>${opt(S.bands,h.band_id)}<option value="__new">${t('newBandOpt')}</option></select></div>
    <div class="row2">
      <div class="fg"><label>${t('sire')}</label><select id="f-sire"><option value="">${t('unknownOpt')}</option>${opt(sires,h.sire_id)}</select></div>
      <div class="fg"><label>${t('dam')}</label><select id="f-dam"><option value="">${t('unknownOpt')}</option>${opt(dams,h.dam_id)}</select></div>
    </div>
    <div class="fg"><label>${t('color')}</label><input id="f-color" value="${esc(h.color)}" placeholder="${t('colorPh')}"></div>
    <div class="fg"><label>${t('markings')}</label><input id="f-markings" value="${esc(h.markings)}" placeholder="${t('markingsPh')}"></div>
    <div class="fg"><label>${t('notes')}</label><textarea id="f-notes" placeholder="${t('notesPh')}">${esc(h.notes)}</textarea></div>
    <div class="actions">
      <button class="btn btn-primary" id="sv">${t('save')}</button>
      <button class="btn" data-close>${t('cancel')}</button>
    </div>`, el=>{
      const pg=el.querySelector('#pg'), pf=el.querySelector('#pf');
      const drawPhotos=()=>{
        const all=[...existing.map(p=>({key:p.id,url:URLS[p.thumb_path],row:p})), ...pending.map(p=>({key:p.key,url:p.url,pend:p}))];
        if(!cover&&all.length) cover=all[0].key;
        pg.innerHTML = all.map(p=>`<div class="ph ${p.key===cover?'cover':''}">${p.url?`<img src="${esc(p.url)}" alt="">`:''}
          <button class="rm" data-rm="${p.key}">${t('remove')}</button>
          <button class="cv" data-cv="${p.key}">${p.key===cover?t('cover'):t('makeCover')}</button></div>`).join('')
          + `<div class="ph add" id="padd"><span>📷</span>${t('addPhoto')}</div>`;
        pg.querySelector('#padd').onclick=()=>pf.click();
        pg.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{ cover=b.dataset.cv; drawPhotos(); });
        pg.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
          if(!confirm(t('confirmPhoto'))) return;
          const k=b.dataset.rm, ex=existing.find(p=>p.id===k);
          if(ex){ removed.push(ex); existing=existing.filter(p=>p.id!==k); }
          else pending.splice(pending.findIndex(p=>p.key===k),1);
          if(cover===k) cover=null; drawPhotos();
        });
      };
      pf.onchange=async()=>{
        for(const file of pf.files){
          try{
            const [full,thumb]=await Promise.all([shrink(file,1600,.82),shrink(file,360,.78)]);
            pending.push({key:'new'+Math.random().toString(36).slice(2),full,thumb,url:URL.createObjectURL(thumb)});
          }catch(e){ console.error(e); toast(t('photoFail')); }
        }
        pf.value=''; drawPhotos();
      };
      drawPhotos();

      el.querySelector('#f-band').onchange=async e=>{
        if(e.target.value!=='__new') return;
        const name=(prompt(t('newBandPrompt'))||'').trim();
        if(!name){ e.target.value=h.band_id||''; return; }
        try{ const b=await store.upsert('bands',{name}); S.bands.push(b); const o=new Option(b.name,b.id,true,true); e.target.insertBefore(o,e.target.lastElementChild); }
        catch(err){ console.error(err); toast(t('offline')); e.target.value=h.band_id||''; }
      };

      el.querySelector('#sv').onclick=async()=>{
        const v=s=>el.querySelector(s).value.trim();
        const name=v('#f-name'); if(!name){ toast(t('needName')); el.querySelector('#f-name').focus(); return; }
        const btn=el.querySelector('#sv'); btn.disabled=true; btn.textContent=t('saving'); el.classList.add('busy');
        try{
          const row={ name, sex:v('#f-sex'), status:v('#f-status'),
            birth_year:v('#f-year')?+v('#f-year'):null, birth_year_approx:el.querySelector('#f-approx').checked,
            last_seen:v('#f-seen')||null, band_id:(v('#f-band')&&v('#f-band')!=='__new')?v('#f-band'):null,
            sire_id:v('#f-sire')||null, dam_id:v('#f-dam')||null,
            color:v('#f-color')||null, markings:v('#f-markings')||null, notes:v('#f-notes')||null };
          if(id) row.id=id;
          const saved=await store.upsert('horses',row);
          // photos
          const keyToId={};
          for(let i=0;i<pending.length;i++){
            toast(t('uploading',i+1,pending.length),60000);
            const p=pending[i], stem=`${saved.id}/${crypto.randomUUID()}`;
            await store.uploadFile(stem+'.jpg',p.full);
            await store.uploadFile(stem+'_thumb.jpg',p.thumb);
            const pr=await store.upsert('horse_photos',{horse_id:saved.id,path:stem+'.jpg',thumb_path:stem+'_thumb.jpg'});
            keyToId[p.key]=pr.id;
            URLS[pr.path]=URL.createObjectURL(p.full); URLS[pr.thumb_path]=p.url;
          }
          for(const r of removed){ await store.remove('horse_photos',r.id); await store.removeFiles([r.path,r.thumb_path]); }
          const coverId=keyToId[cover]||cover||null;
          if(coverId!==saved.cover_photo_id) await store.upsert('horses',{id:saved.id,name:saved.name,cover_photo_id:coverId});
          document.querySelectorAll('.toast').forEach(n=>n.remove());
          toast(t('saved',name));
          await refresh(); showHorse(saved.id);
        }catch(e){
          console.error(e); toast(t('offline'));
          btn.disabled=false; btn.textContent=t('save'); el.classList.remove('busy');
        }
      };
      if(!id) setTimeout(()=>el.querySelector('#f-name').focus(),60);
    });
}

async function deleteHorse(id){
  const h=H(id); if(!h||!confirm(t('confirmDel',h.name))) return;
  try{
    const ps=photosOf(id);
    await store.remove('horses',id);
    await store.removeFiles(ps.flatMap(p=>[p.path,p.thumb_path]));
    closeSheet(); toast(t('deleted',h.name)); await refresh();
  }catch(e){ console.error(e); toast(t('offline')); }
}

// ── Menu ───────────────────────────────────────────────────────
function showMenu(){
  openSheet=showMenu;
  sheet(`<h2>${t('menu')}</h2>
    <div class="val" style="color:var(--muted);margin-bottom:14px">${me?esc(t('signedInAs',me.email)):esc(t('demoBanner'))}</div>
    <div style="display:grid;gap:8px">
      <button class="btn" id="m-bands">${t('menuBands')}</button>
      <button class="btn" id="m-exp">${t('menuExport')}</button>
      <button class="btn" id="m-imp">${t('menuImport')}</button>
      <input type="file" id="m-file" accept=".json,application/json" hidden>
      ${me?`<button class="btn" id="m-out">${t('menuSignOut')}</button>`:''}
    </div>`, el=>{
      el.querySelector('#m-exp').onclick=exportBackup;
      el.querySelector('#m-imp').onclick=()=>el.querySelector('#m-file').click();
      el.querySelector('#m-file').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); if(d&&d.exported) await restoreBackup(d); else await importOld(d); }catch(err){ console.error(err); toast(t('offline')); } };
      el.querySelector('#m-bands').onclick=renameBands;
      const out=el.querySelector('#m-out'); if(out) out.onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
    });
}
async function renameBands(){
  for(const b of [...S.bands].sort(byName)){
    const n=prompt(t('renameBand',b.name),b.name); if(n===null) continue;
    try{ if(!n.trim()) await store.remove('bands',b.id); else if(n.trim()!==b.name) await store.upsert('bands',{id:b.id,name:n.trim()}); }
    catch(e){ console.error(e); toast(t('offline')); }
  }
  await refresh();
}
function exportBackup(){
  const out={ exported:new Date().toISOString(), bands:S.bands, horses:S.horses, horse_photos:S.horse_photos };
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download=`wild-horses-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
}

// ── Put back a backup file this app wrote (the exportBackup shape) ──
const BACKUP_COLS = {
  bands:['id','name','notes','created_at','updated_at','updated_by'],
  horses:['id','name','sex','birth_year','birth_year_approx','color','markings','band_id','sire_id','dam_id','status','last_seen','notes','cover_photo_id','created_at','updated_at','updated_by'],
  horse_photos:['id','horse_id','path','thumb_path','created_at','created_by']
};
async function restoreBackup(d){
  const rowsOf = tb => (Array.isArray(d[tb])?d[tb]:[]).filter(r=>r&&r.id)
    .map(r=>{ const o={}; for(const c of BACKUP_COLS[tb]) if(r[c]!==undefined) o[c]=r[c]; return o; });
  // bands first, then horses, then photos — so band_id / sire_id / dam_id / cover_photo_id all land on rows that exist
  const tables=[['bands',rowsOf('bands')],['horses',rowsOf('horses')],['horse_photos',rowsOf('horse_photos')]];
  try{
    for(const [tb,rows] of tables){
      if(!rows.length) continue;
      const {error}=await sb.from(tb).upsert(rows,{onConflict:'id'});
      if(error) throw error;
    }
  }catch(e){ console.error(e); toast(t('restoreFail')); return; }
  toast(t('restored',tables[1][1].length)); closeSheet(); await refresh();
}

// ── Bring in horses from the old one-device version (localStorage 'whft2') ──
async function importOld(d){
  const old = Object.values(d.horses||d).filter(x=>x&&x.name);
  if(!old.length) return;
  const idMap={};
  for(const o of old){
    const row=await store.upsert('horses',{ name:o.name, sex:['stallion','mare','gelding'].includes(o.sex)?o.sex:'unknown',
      birth_year:o.birthYear||null, color:o.color||null, markings:o.markings||null, notes:o.comments||null, status:'here' });
    idMap[o.id]=row.id;
    if(o.photo&&o.photo.startsWith('data:')){
      try{ const blob=await (await fetch(o.photo)).blob(); const [full,thumb]=await Promise.all([shrink(blob,1600,.82),shrink(blob,360,.78)]);
        const stem=`${row.id}/${crypto.randomUUID()}`; await store.uploadFile(stem+'.jpg',full); await store.uploadFile(stem+'_thumb.jpg',thumb);
        const pr=await store.upsert('horse_photos',{horse_id:row.id,path:stem+'.jpg',thumb_path:stem+'_thumb.jpg'});
        URLS[pr.path]=URL.createObjectURL(full); URLS[pr.thumb_path]=URL.createObjectURL(thumb);
      }catch(e){ console.error(e); }
    }
  }
  for(const o of old){ if((o.sireId&&idMap[o.sireId])||(o.damId&&idMap[o.damId])) await store.upsert('horses',{id:idMap[o.id],name:o.name,sire_id:idMap[o.sireId]||null,dam_id:idMap[o.damId]||null}); }
  toast(t('imported',old.length)); closeSheet(); await refresh();
}
function checkOldData(){
  let old; try{ old=JSON.parse(localStorage.getItem('whft2')||'null'); }catch(e){}
  const n=old?Object.keys(old).length:0;
  if(!n||localStorage.getItem('whft2-done')) return;
  $('#banner-slot').innerHTML=`<div class="banner">${esc(t('oldFound',n))}<br><button class="btn btn-primary" id="old-yes">${t('oldImport')}</button><button class="btn" id="old-no">${t('oldDismiss')}</button></div>`;
  $('#old-yes').onclick=async()=>{ $('#banner-slot').innerHTML=''; await importOld(old); try{ localStorage.setItem('whft2-done','1') }catch(e){} };
  $('#old-no').onclick=()=>{ $('#banner-slot').innerHTML=''; };
}

// ═══════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════
function show(id){ ['login','denied','app'].forEach(s=>$('#'+s).hidden=s!==id); }

async function startApp(){
  show('app'); initTree();
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ view=b.dataset.view; render(); });
  $('#search').oninput=e=>{ query=e.target.value; render(); };
  $('#add-btn').onclick=()=>editHorse(null);
  $('#menu-btn').onclick=showMenu;
  window.addEventListener('resize',()=>{ if(view==='tree'){ treeFitted=false; renderTree(); } });
  if(DEMO) $('#banner-slot').innerHTML=`<div class="banner" data-t="demoBanner">${esc(t('demoBanner'))}</div>`;
  await refresh();
  store.subscribe(refresh);
  checkOldData();
}

async function boot(){
  applyLang();
  if(DEMO) return startApp();
  if(!configured || !window.supabase){
    show('denied'); $('#denied h1').textContent=t('setupTitle');
    $('#denied-msg').innerHTML=`${esc(t('setup'))}<br><br><a class="btn" href="?demo">${t('demo')}</a>`; $('#denied-out').hidden=true; return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return showLogin();
  me = session.user;
  const { data:isMember, error } = await sb.rpc('is_member');
  if(error){ console.error(error); toast(t('offline')); }
  if(!isMember){
    show('denied'); $('#denied-msg').textContent=t('denied',me.email);
    $('#denied-out').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
    return;
  }
  startApp();
}

function showLogin(){
  show('login');
  let email='';
  $('#send-code').onclick=async()=>{
    email=$('#email').value.trim().toLowerCase(); if(!email.includes('@')) return $('#email').focus();
    const b=$('#send-code'); b.disabled=true;
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin+location.pathname } });
    b.disabled=false;
    if(error){ console.error(error); return toast(error.message||t('offline'),5000); }
    $('#login-email').hidden=true; $('#login-code').hidden=false;
    $('#code-msg').textContent=t('codeSent',email); $('#code').focus();
  };
  $('#email').onkeydown=e=>{ if(e.key==='Enter') $('#send-code').click(); };
  $('#verify-code').onclick=async()=>{
    const token=$('#code').value.replace(/\D/g,''); if(!token) return;
    const { error } = await sb.auth.verifyOtp({ email, token, type:'email' });
    if(error){ console.error(error); return toast(t('badCode'),4000); }
    location.reload();
  };
  $('#code').onkeydown=e=>{ if(e.key==='Enter') $('#verify-code').click(); };
  $('#back-email').onclick=()=>{ $('#login-email').hidden=false; $('#login-code').hidden=true; };
}

// magic-link sign-ins land here with tokens in the URL; getSession() in boot picks them up
boot();
</script>
